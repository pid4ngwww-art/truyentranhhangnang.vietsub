    <title>Truyện Tranh Hạng Nặng</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 0; }
        header { background-color: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; color: #ff4757; border-bottom: 2px solid #ff4757; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .nut-bam { display: inline-block; color: #ff4757; text-decoration: none; font-size: 15px; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
        h2 { font-size: 18px; border-left: 4px solid #ff4757; padding-left: 8px; }
        .grid-truyen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .item-truyen { background-color: #1f1f1f; border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .item-truyen img { width: 100%; height: 200px; object-fit: cover; }
        .item-truyen .ten-truyen { padding: 8px; font-size: 14px; font-weight: bold; text-align: center; }
        .thong-tin-truyen { display: flex; gap: 15px; margin-bottom: 25px; background-color: #1f1f1f; padding: 15px; border-radius: 8px; }
        .thong-tin-truyen img { width: 100px; height: 140px; object-fit: cover; border-radius: 4px; }
        .chi-tiet h3 { margin: 0 0 8px 0; color: #ff4757; }
        .chi-tiet p { margin: 4px 0; font-size: 13px; color: #ccc; }
        .danh-sach-chap { display: flex; flex-direction: column; gap: 10px; }
        .item-chap { background-color: #1f1f1f; padding: 12px 15px; border-radius: 6px; font-size: 15px; display: flex; justify-content: space-between; border: 1px solid #333; cursor: pointer; }
        .khu-vuc-doc { background-color: #1a1a1a; padding: 15px; border-radius: 8px; }
        .tieu-de-chuong { text-align: center; color: #ff4757; margin-bottom: 20px; font-size: 20px; }
        .noi-dung-chu { font-size: 18px; line-height: 1.8; color: #e0e0e0; white-space: pre-line; text-align: justify; }
        .dieu-huong-cuoi { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 15px; border-top: 1px solid #333; }
        .nut-chuyen-trang { background-color: #ff4757; color: white; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; min-width: 80px; }
        .nut-vo-dung { background-color: #444; color: #888; cursor: not-allowed; }
    </style>
</head>

            </div>

        let truyenHienTai = "";

        function anTatCaManHinh() {
            document.getElementById('man-hinh-trang-chu').style.display = 'none';
            document.getElementById('man-hinh-chon-chap').style.display = 'none';
            document.getElementById('man-hinh-doc-truyen').style.display = 'none';
        }

        function moTrangChonChap(idTruyen) {
            truyenHienTai = idTruyen;
            const data = KHO_TRUYEN[idTruyen];
            
            document.getElementById('ten-truyen-chi-tiet').innerText = data.ten;
            document.getElementById('anh-bia-chi-tiet').src = data.bia;
            document.getElementById('tac-gia-chi-tiet').innerText = data.tacGia;
            document.getElementById('the-loai-chi-tiet').innerText = data.theLoai;
            
            // Hiển thị phần tóm tắt truyện vào giao diện
            let khungChiTiet = document.querySelector('.chi-tiet');
            let doanTomTat = document.getElementById('tom-tat-truyen');
            if (!doanTomTat) {
                khungChiTiet.insertAdjacentHTML('beforeend', `<p id="tom-tat-truyen" style="font-size:12px; color:#aaa; margin-top:8px; border-top:1px dashed #444; padding-top:5px;"><strong>Tóm tắt:</strong> ${data.tomTat}</p>`);
            } else {
                doanTomTat.innerHTML = `<strong>Tóm tắt:</strong> ${data.tomTat}`;
            }
            
            let htmlChap = "";
            data.chương.forEach((item, index) => {
                htmlChap += `<div class="item-chap" onclick="moTrangDocTruyen(${index})">
                                <span>${item.ten}</span>
                                <span style="color: #ff4757; font-size: 13px;">Đọc →</span>
                             </div>`;
            });
            document.getElementById('danh-sach-chap-render').innerHTML = htmlChap;

            anTatCaManHinh();
            document.getElementById('man-hinh-chon-chap').style.display = 'block';
            window.scrollTo(0, 0);
        }

            let vungChứaChữ = document.getElementById('noi-dung-chu-render');
            if (dataChap.laTruyenTranh) {
                let htmlAnh = "";
                dataChap.anhTruyen.forEach(linkAnh => {
                    htmlAnh += `<img src="${linkAnh}" style="width:100%; display:block; margin-bottom:8px; border-radius:4px;" alt="Trang truyện">`;
                });
                // Chèn thêm phần tóm tắt chap lên đầu trang đọc nếu muốn
                vungChứaChữ.innerHTML = `<div style="font-size:14px; color:#aaa; background:#222; padding:10px; margin-bottom:15px; border-radius:5px; font-style:italic;">${dataChap.noiDung}</div>` + htmlAnh;
            } else {
                vungChứaChữ.innerText = dataChap.noiDung;
            }

            const nutTruoc = document.getElementById('nut-chap-truoc');
            const nutSau = document.getElementById('nut-chap-sau');

            if (indexChap === 0) {
                nutTruoc.classList.add('nut-vo-dung');
            } else {
                nutTruoc.classList.remove('nut-vo-dung');
            }

            if (indexChap === dataTruyen.chương.length - 1) {
                nutSau.classList.add('nut-vo-dung');
                nutSau.innerText = "Hết chap";
            } else {
                nutSau.classList.remove('nut-vo-dung');
                nutSau.innerText = "Chap sau";
            }

            anTatCaManHinh();
            document.getElementById('man-hinh-doc-truyen').style.display = 'block';
            window.scrollTo(0, 0);
        }

        function chuyenChap(huongDi) {
            const indexMoi = chapHienTaiIndex + huongDi;
            const dataTruyen = KHO_TRUYEN[truyenHienTai];

            if (indexMoi >= 0 && indexMoi < dataTruyen.chương.length) {
                moTrangDocTruyen(indexMoi);
            }
        }

        function veTrangChu() {
            anTatCaManHinh();
            document.getElementById('man-hinh-trang-chu').style.display = 'block';
        }

        function veTrangChonChap() {
            moTrangChonChap(truyenHienTai);
        }
    </script>
